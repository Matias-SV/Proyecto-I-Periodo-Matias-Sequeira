<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Contacto</title>
    <!---Enlazamos la hoja de estilos del formulario para mantener la apariencia consistente con el sistema. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>

<!---Encabezado con el logo del sistema y el botón para cerrar sesión. -->
<header class="header">
    <div class="header-logo">
        <img src="{{ url_for('static', filename='Images/imagen_logo.png') }}" alt="Logo">
        Gestor de Contactos
    </div>
    <a href="{{ url_for('logout') }}" class="btn-cerrar-sesion">&#8594; Cerrar Sesion</a>
</header>

<!---Área principal del formulario, centrada con un ancho máximo para mejor legibilidad. -->
<div class="form-area">
    <div class="form-panel">

        <!---Encabezado del panel con el título del formulario, descripción, y botón para cerrar y regresar. -->
        <div class="form-header">
            <div>
                <h2>Agregar Contacto</h2>
                <p>Complete la informacion del nuevo contacto</p>
            </div>
            <a href="{{ url_for('contactos') }}" class="btn-x">&#x2715;</a>
        </div>

        <!---Si el servidor retorna un error de validación, lo mostramos aquí antes del formulario. -->
        {% if error %}<p class="alerta">ⓘ {{ error }}</p>{% endif %}

        <!---Formulario de registro de nuevo contacto con validación en el lado del cliente al enviar. -->
        <form method="POST" onsubmit="return validarForm()">
            <div class="form-body">

                <!---Distribución en dos columnas para los campos principales: nombre, correo, teléfono, apellido, dirección y categoría. -->
                <div class="dos-col">
                    <div class="campo">
                        <label>Nombre Completo *</label>
                        <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
                    </div>
                    <div class="campo">
                        <label>Email *</label>
                        <input type="text" name="correo" id="correo" placeholder="correo@dominio.com" required>
                    </div>
                    <div class="campo">
                        <label>Telefono * (8 digitos)</label>
                        <input type="text" name="telefono" id="telefono" placeholder="88001122" required>
                    </div>
                    <div class="campo">
                        <label>Apellido / Empresa</label>
                        <input type="text" name="apellido" placeholder="Apellido o empresa">
                    </div>
                    <div class="campo">
                        <label>Cargo/Direccion</label>
                        <input type="text" name="direccion" placeholder="Cargo o direccion">
                    </div>
                    <!---Selector de categoría con las opciones disponibles: Familia, Trabajo, Amigos u Otro. -->
                    <div class="campo">
                        <label>Categoria</label>
                        <select name="categoria">
                            <option value="Familia">Familia</option>
                            <option value="Trabajo">Trabajo</option>
                            <option value="Amigos">Amigos</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>

                <!---Selector de estado del contacto: activo (favorito) o normal, con "Normal" seleccionado por defecto. -->
                <div class="campo">
                    <label>Estado</label>
                    <select name="favorito">
                        <option value="si">Activo (Favorito)</option>
                        <option value="no" selected>Normal</option>
                    </select>
                </div>

                <!---Campo de texto libre para añadir notas adicionales sobre el contacto. -->
                <div class="campo">
                    <label>Notas</label>
                    <textarea name="notas" placeholder="Notas adicionales..."></textarea>
                </div>
            </div>

            <!---Pie del formulario con el botón para guardar el contacto y el enlace para cancelar la operación. -->
            <div class="form-footer">
                <button type="submit" class="btn-guardar">Guardar Contacto</button>
                <a href="{{ url_for('contactos') }}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<!---Función de validación del formulario en el lado del cliente: verifica que nombre, correo y teléfono sean válidos antes de enviar. -->
<script>
function validarForm() {
    var nombre = document.getElementById('nombre').value.trim();
    var correo = document.getElementById('correo').value.trim();
    var telefono = document.getElementById('telefono').value.trim();
    if (!nombre || !telefono || !correo) {
        alert('Los campos nombre, telefono y correo son obligatorios.');
        return false;
    }
    if (!correo.includes('@') || correo.split('@')[1].indexOf('.') === -1) {
        alert('El correo no tiene un formato valido.');
        return false;
    }
    if (!/^\d{8}$/.test(telefono)) {
        alert('El telefono debe tener exactamente 8 digitos numericos.');
        return false;
    }
    return true;
}
</script>
</body>
</html>
